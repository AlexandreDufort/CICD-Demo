name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm' # Recommended: speeds up future workflow runs
    
    - name: Install dependencies
      run: npm ci # Recommended over npm install for CI builds
    
    - name: Fix binary permissions
      run: chmod -R +x node_modules/.bin
    
    - name: Run tests
      run: npm test